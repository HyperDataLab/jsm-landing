name: Windows installer release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-draft-release:
    name: Build Windows installer and create draft release
    runs-on: windows-latest
    steps:
      - name: Checkout FE source
        uses: actions/checkout@v7
        with:
          repository: HyperDataLab/jsm-fe
          ref: ${{ vars.JSM_FE_REF || 'hao/update/package-exe' }}
          path: jsm-fe
          token: ${{ secrets.JSM_SOURCE_REPO_READ_TOKEN || github.token }}

      - name: Checkout BE packager
        uses: actions/checkout@v7
        with:
          repository: HyperDataLab/jsm-be
          ref: ${{ vars.JSM_BE_REF || 'codex/windows-installer-release' }}
          path: jsm-be
          token: ${{ secrets.JSM_SOURCE_REPO_READ_TOKEN || github.token }}

      - name: Verify release tag matches installer version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Expected a semantic version tag like v1.0.0; got '$tag'."
          }

          $version = $Matches.version
          $installerScript = Get-Content 'jsm-be/packaging/windows/installer.iss' -Raw
          $versionPattern = '(?m)^\s*#define ProductVersion "' + [regex]::Escape($version) + '"\s*$'
          if ($installerScript -notmatch $versionPattern) {
            throw "Release tag '$tag' does not match ProductVersion in installer.iss."
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: jsm-be/requirements-desktop.txt

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build installer without a snapshot
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $flutter = (Get-Command flutter).Source
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & .\jsm-be\packaging\windows\build-installer.ps1 `
            -PythonExecutable $python `
            -FlutterExecutable $flutter `
            -ISCCPath $iscc
          if ($LASTEXITCODE -ne 0) { throw 'The Windows installer build failed.' }

          $installer = 'jsm-be/packaging/windows/output/JSM-Setup.exe'
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Expected installer was not produced: $installer"
          }

      - name: Create draft GitHub release in landing
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: JSM ${{ github.ref_name }}
          draft: true
          prerelease: false
          token: ${{ github.token }}
          fail_on_unmatched_files: true
          files: jsm-be/packaging/windows/output/JSM-Setup.exe
          body: |
            Windows x64 installer for JSM.

            - Installs the app and its local API; Docker is not required.
            - Starts with an empty local journal database; no snapshot is bundled.
            - SSO, OpenAlex requests, and manuscript analysis require Internet access.
            - After SSO, saved local data can be viewed offline for up to 7 days.
